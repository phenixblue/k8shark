version: "2"

run:
  timeout: 3m

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are exactly the
  # "standard" default set in golangci-lint v2, so they no longer need an
  # explicit enable list.
  default: standard

  # staticcheck runs its full default set: SA* plus the gosimple (S1*),
  # stylecheck (ST1*) and quickfix (QF*) analyzers that v2 folded into it.

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
